<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 보안: 이 사이트의 파일만 실행·로드 (끼워넣은 스크립트, 외부 스크립트 차단) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
<meta name="description" content="점진적 과부하 운동 기록 · 단백질 계산">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WORKOUT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0}</style>
<title>WORKOUT</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  /* Layout: one phone-width training logbook (max 560px) — sticky title bar, ruled set rows, tab bar pinned to the bottom edge */
  --bg:#EDEFEC;
  --panel:#FFFFFF;
  --sunk:#E3E6E2;
  --ink:#15181C;
  --ink-2:#4A5157;
  --ink-3:#666D74;
  --line:#D2D6D2;
  --hi:#F2B705;
  --hi-soft:#FBF0C4;
  --on-hi:#1C1600;
  --up:#C0222F;
  --up-soft:#FBE4E5;
  --on-up:#FFFFFF;
  --down:#1D5CC8;
  --down-soft:#E3EBFA;
  --ok:#1D8A53;
  --ok-soft:#DCF0E3;
  --on-ok:#FFFFFF;
  --on-ink:#FFFFFF;
  --scrim:rgba(14,16,19,.5);
  --shadow:0 1px 0 rgba(21,24,28,.04),0 12px 30px -14px rgba(21,24,28,.3);
  --shadow-sm:0 1px 2px rgba(21,24,28,.16);
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
  --tabbar-h:62px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101316;--panel:#191D21;--sunk:#22272C;--ink:#ECEEEC;--ink-2:#B3B9BE;--ink-3:#8A9299;--line:#2C3237;
    --hi:#F4C430;--hi-soft:#3A3116;--on-hi:#1C1600;
    --up:#FF5C66;--up-soft:#3D1B1F;--on-up:#1B0507;
    --down:#6E9EFF;--down-soft:#182849;
    --ok:#3DCB84;--ok-soft:#13331F;--on-ok:#06170D;
    --on-ink:#101316;--scrim:rgba(0,0,0,.62);
    --shadow:0 1px 0 rgba(0,0,0,.35),0 14px 32px -14px rgba(0,0,0,.8);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101316;--panel:#191D21;--sunk:#22272C;--ink:#ECEEEC;--ink-2:#B3B9BE;--ink-3:#8A9299;--line:#2C3237;
  --hi:#F4C430;--hi-soft:#3A3116;--on-hi:#1C1600;
  --up:#FF5C66;--up-soft:#3D1B1F;--on-up:#1B0507;
  --down:#6E9EFF;--down-soft:#182849;
  --ok:#3DCB84;--ok-soft:#13331F;--on-ok:#06170D;
  --on-ink:#101316;--scrim:rgba(0,0,0,.62);
  --shadow:0 1px 0 rgba(0,0,0,.35),0 14px 32px -14px rgba(0,0,0,.8);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4,p,ul{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-2)}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);transition:box-shadow .2s}
.top.scrolled{box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font:400 21px/1.1 var(--f-display);letter-spacing:.01em;white-space:nowrap}
.brand span{font:600 11px/1 var(--f-num);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync[data-s="saved"] i,.sync[data-s="local"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--hi)}
.sync[data-s="error"] i,.sync[data-s="memory"] i{background:var(--up)}
@media (max-width:440px){.brand span{display:none}}

/* 버튼 */
.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.block{display:flex;width:100%;height:52px;font-size:15px;border-radius:13px}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink)}
.btn.dashed{background:transparent;border:1.5px dashed var(--line);color:var(--ink-2)}
.btn.dashed:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.danger-line{background:transparent;border-color:var(--up);color:var(--up)}
.btn.danger-fill{background:var(--up);border-color:var(--up);color:var(--on-up)}
.gap-top{margin-top:12px}
.icon-btn{appearance:none;display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;flex:none}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.icon-btn.xs{width:30px;height:30px;border-radius:9px}
.icon-btn.xs .ic{width:17px;height:17px}
.icon-btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

/* 공통 레이아웃 */
main.wrap{padding-block:4px calc(var(--tabbar-h) + 36px)}
body.has-rest main.wrap{padding-bottom:calc(var(--tabbar-h) + 112px)}
.head{margin:10px 2px 16px}
.eyebrow{font:600 13px/1.2 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.page-title{font:400 30px/1.15 var(--f-display);letter-spacing:.005em;margin-top:5px;text-wrap:balance;overflow-wrap:anywhere}
.stack{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:22px 18px;display:grid;gap:10px;justify-items:start}
.empty h2{font:700 17px/1.35 var(--f-body)}
.empty p{color:var(--ink-2);font-size:14px;max-width:46ch}
.empty .row{margin-top:4px}
.banner{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--up-soft);font-size:13.5px}

/* 다음 목표 칩 */
.rec{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:5px 11px;border-radius:999px;background:var(--sunk);font:500 13px/1.25 var(--f-body);color:var(--ink)}
.rec b{font-weight:700;white-space:nowrap}
.nv{font:600 15px/1.1 var(--f-num);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.rec[data-k="up"]{background:var(--up-soft)}
.rec[data-k="up"] b{color:var(--up)}
.rec[data-k="deload"],.rec[data-k="stall"]{background:var(--down-soft)}
.rec[data-k="deload"] b{color:var(--down)}
.rec[data-k="new"]{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}

/* 오늘 탭 */
.rt{padding:16px 16px 14px;display:grid;gap:12px}
.rt-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.rt-h h2{font:700 18px/1.35 var(--f-body);overflow-wrap:anywhere;min-width:0}
.tag{display:inline-block;margin-left:8px;padding:4px 7px;border-radius:6px;background:var(--hi);color:var(--on-hi);font:700 11px/1 var(--f-body);vertical-align:3px}
.ago{font-size:12.5px;color:var(--ink-3)}
.plan{list-style:none;padding:0;display:grid}
.plan li{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0;padding-top:2px}
.pn{font-weight:500;min-width:0;overflow-wrap:anywhere}
.plan li.pl{display:block;padding:0}
.pl-h{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:46px;padding:7px 0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.plan li.pl:first-child .pl-h{padding-top:0}
.chev{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--sunk);color:var(--ink-2)}
.chev .ic,.ed-tg .ic{width:17px;height:17px;transition:transform .18s}
.pl-h[aria-expanded="true"] .chev{background:var(--ink);color:var(--on-ink)}
.pl-h[aria-expanded="true"] .chev .ic,.ed-tg[aria-expanded="true"] .ic{transform:rotate(180deg)}
.pdet{display:grid;gap:12px;padding:2px 0 14px}
.rt-t{font:700 18px/1.35 var(--f-body);min-width:0}
.rt-tg{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rt-tx{display:grid;gap:3px;min-width:0}
.rt-n{overflow-wrap:anywhere}
.rt-tg .ago{font-weight:400}
.rt-tg[aria-expanded="true"] .chev{background:var(--ink);color:var(--on-ink)}
.rt-tg[aria-expanded="true"] .chev .ic{transform:rotate(180deg)}
.pd-next{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.pd-f{display:flex;flex-wrap:wrap;gap:10px 14px}
.rules{margin-top:18px;padding:4px 14px;border-radius:14px;background:var(--sunk)}
.rules summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:14px;color:var(--ink-2)}
.rules ul{list-style:none;padding:0;display:grid;gap:12px;margin:4px 0 12px}
.rules li{display:grid;gap:6px;justify-items:start}
.rules li p{font-size:13.5px;color:var(--ink-2)}
.rules .rec[data-k="reps"]{background:var(--panel)}
.fine{font-size:12.5px;margin-bottom:12px}

/* 운동 중 */
.sess-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 2px 12px}
.sess-id{min-width:0}
.clock{font:700 36px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.meter{height:6px;margin:0 2px;border-radius:6px;background:var(--ok-soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:var(--ok);transition:width .3s ease}
.sess-sum{margin:9px 2px 14px;font-size:13.5px;color:var(--ink-2)}
.sess-sum b{font:700 17px/1 var(--f-num);color:var(--ink)}
.ex{padding:14px 10px 12px}
.ex-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px}
.ex-t{min-width:0}
.ex-t h3{font:700 18px/1.3 var(--f-body);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:3px 7px;border-radius:6px;background:var(--ok-soft);font:600 11.5px/1 var(--f-body);vertical-align:3px}
.pill::before{content:"✓";color:var(--ok);font-weight:700}
.meta{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-3)}
.ex-ctx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:10px 4px 0}
.last{font-size:12.5px;color:var(--ink-2)}
.note{margin:8px 4px 0;font-size:12.5px;color:var(--ink-2)}
.set-head,.set{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.set-head{padding:14px 4px 6px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.set-head span:first-child,.set-head span:last-child{text-align:center}
.sets{display:grid;gap:4px}
.set{padding:4px;border-radius:12px;transition:background .15s}
.no{font:700 20px/1 var(--f-num);color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.field{position:relative;min-width:0}
.field input{width:100%;height:46px;padding:0 30px 0 12px;border:0;border-radius:10px;background:var(--sunk);color:var(--ink);font:700 22px/1 var(--f-num);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--ink-3);font-weight:500}
.field input:focus{outline:none;background:var(--panel);box-shadow:0 0 0 2px var(--ink)}
.field .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-3);pointer-events:none}
.field.wide-u input{padding-right:44px}
.notice.bwn{display:flex;align-items:center;justify-content:space-between;gap:10px}
.notice.bwn .btn{flex:none}
.chk{appearance:none;display:grid;place-items:center;width:46px;height:46px;padding:0;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink-3);cursor:pointer}
.chk .ic{width:22px;height:22px;stroke-width:2.4}
.chk:hover{border-color:var(--ink-3);color:var(--ink)}
.set.done{background:var(--ok-soft)}
.set.done .no{color:var(--ok)}
.set.done .field input{background:transparent}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.ex.hp .set-head,.ex.hp .set{grid-template-columns:26px 54px minmax(0,1fr) minmax(0,1fr) 46px;gap:6px}
/* 지난번 칸이 있을 땐 단위는 위 머리글(무게 kg·횟수)에만 두고 숫자 칸을 넓게 */
.ex.hp .field input{padding:0 8px 0 10px;font-size:21px}
.ex.hp .field .u,.ex.hp .field.wide-u .u{display:none}
.ex.hp .field.wide-u input{padding-right:8px}
.ex.hp .set-head span:nth-child(2){text-align:center}
.prev{appearance:none;display:grid;justify-items:center;align-content:center;gap:1px;height:46px;min-width:0;padding:0 2px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--ink-2);font:600 12px/1.15 var(--f-num);font-variant-numeric:tabular-nums;cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden}
.prev b{font-weight:700;color:var(--ink);white-space:nowrap}
.prev span{white-space:nowrap}
.prev:active{background:var(--sunk)}
.prev.none{border-color:transparent;color:var(--ink-3);cursor:default;font-size:14px}
.set.done .prev{border-color:transparent}
.ex-foot{display:flex;gap:6px;margin-top:10px;padding:0 4px}
.addex{margin-top:12px;padding:14px;display:grid;gap:10px}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.txt{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:500 16px/1 var(--f-body)}
.txt:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.row .grow{flex:1 1 auto}
.row.end{justify-content:flex-end}
.row.center{justify-content:center;margin-top:16px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:11px;background:var(--sunk)}
.seg button{appearance:none;height:34px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font:600 13px/1 var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg.sm button{height:30px;padding:0 10px;font-size:12.5px}
.sess-actions{display:grid;gap:6px;margin-top:20px}

/* 루틴 관리 */
.rt-row{padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rt-main{flex:1 1 200px;min-width:0}
.rt-main h2{font:700 17px/1.35 var(--f-body);overflow-wrap:anywhere}
.rt-main p{margin-top:4px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.rt-main .nv{font-size:14px}
.rt-actions{display:flex;gap:6px}

/* 기록 탭 */
.month{display:flex;align-items:baseline;gap:8px;margin:22px 2px 10px;font:700 15px/1.2 var(--f-body)}
.head + .month{margin-top:4px}
.month span{font:600 13px/1 var(--f-num);letter-spacing:.06em;color:var(--ink-3)}
.loglist{padding:0 14px}
.log{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log-d{text-align:center;padding-top:1px}
.log-d b{display:block;font:700 30px/1 var(--f-num);font-variant-numeric:tabular-nums}
.log-d span{font-size:12px;color:var(--ink-3)}
.log-b{min-width:0}
.log-b header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.log-b h3{font:700 16px/1.35 var(--f-body);overflow-wrap:anywhere}
.log-b header p{font-size:12.5px;margin-top:1px}
.log-b header .acts{display:flex;flex:none;margin:-4px -6px 0 0}
.se-list{margin:16px 0 12px}
.se-type{margin-left:8px;font:600 11.5px/1 var(--f-body);color:var(--ink-3);vertical-align:2px}
.preset{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:14px 14px 14px 16px}
.preset-b{flex:1 1 auto;min-width:0}
.preset h2{font:700 15px/1.35 var(--f-body)}
.preset p{margin-top:4px;font-size:12.5px;line-height:1.55}
.preset .btn{flex:none}
.se-note{margin:12px 2px 0;font-size:12.5px;color:var(--ink-2)}
.lines{list-style:none;padding:0;display:grid;gap:4px;margin-top:9px}
.lines li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px}
.ln{min-width:0;overflow-wrap:anywhere}
.lv{font:600 15px/1.3 var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.prs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pr{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:7px;background:var(--hi-soft);font:600 12px/1.25 var(--f-body)}
.pr::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--hi);flex:none}

/* 성장 탭 */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

.part-list{list-style:none;padding:0;display:grid}
.part-row{appearance:none;width:100%;display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(72px,auto);align-items:center;gap:10px;padding:10px 8px;border:0;border-top:1px solid var(--line);border-radius:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}

.pr-n{min-width:0;font-weight:600;overflow-wrap:anywhere}

.spark{width:58px;height:24px;color:var(--ink-3)}
.part-row[aria-pressed="true"] .spark{color:var(--ink)}
.pr-v{display:grid;justify-items:end;gap:2px;font:700 15px/1.15 var(--f-num);white-space:nowrap}
.pr-v small{font:600 12.5px/1.2 var(--f-num)}
.chip{appearance:none;flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font:600 13.5px/1 var(--f-body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chart-card{padding:14px 10px 10px}
.chart-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:0 6px 6px}
.chart-h h2{font:700 15px/1.35 var(--f-body);min-width:0}
.chart-h h2 span{font-weight:500}
.chart{position:relative;width:100%;touch-action:pan-y;border-radius:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-note{padding:2px 6px 4px;font-size:12.5px;color:var(--ink-2)}
.ch-grid{stroke:var(--line);stroke-width:1;fill:none}
.ch-axis{fill:var(--ink-3);font:500 11.5px var(--f-num)}
.ch-area{fill:var(--ink);fill-opacity:.07;stroke:none}
.ch-line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--ink);stroke:var(--panel);stroke-width:2}
.ch-end{fill:var(--ink);stroke:var(--panel);stroke-width:2.5}
.ch-lbl{fill:var(--ink);font:700 14px var(--f-num)}
.ch-lbl.sm{fill:var(--ink-2);font:600 12px var(--f-num)}
.ch-cross{stroke:var(--ink-3);stroke-width:1}
.tip{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-100%);padding:7px 10px;border-radius:9px;background:var(--ink);color:var(--on-ink);font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:var(--shadow)}
.tip b{display:block;font:700 17px/1.1 var(--f-num)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tile .lbl{font-size:11.5px;color:var(--ink-3)}
.tile b{display:block;margin-top:5px;font:700 25px/1.1 var(--f-num);overflow-wrap:anywhere}
.tile small{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-2)}
.tile .pos,.pos{color:var(--up)}
.tile .neg,.neg{color:var(--down)}
.tbl-card{padding:14px 14px 6px}
.tbl-h{font:700 15px/1.3 var(--f-body);margin-bottom:4px}
.tbl-wrap{overflow-x:auto}
.rtbl{width:100%;border-collapse:collapse;font-size:13.5px}
.rtbl th{padding:8px 6px;text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line);white-space:nowrap}
.rtbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rtbl tr:last-child td{border-bottom:0}
.rtbl td:nth-child(2){font:600 15px/1.3 var(--f-num);font-variant-numeric:tabular-nums}
.rtbl .n{text-align:right;white-space:nowrap}
.rtbl td.n{font:600 15px/1.3 var(--f-num);font-variant-numeric:tabular-nums}

/* 탭 바 · 휴식 타이머 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabbar-h)}
.tab{position:relative;appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;border:0;background:none;color:var(--ink-3);font:600 11.5px/1 var(--f-body);cursor:pointer}
.tab .ic{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--hi)}
.tab .live{position:absolute;top:9px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 2px var(--panel)}
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));z-index:7;pointer-events:none}
.rest{position:relative;overflow:hidden;pointer-events:auto;display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 10px 12px 16px;border-radius:16px;background:var(--ink);color:var(--on-ink);box-shadow:var(--shadow)}
.rest .t{min-width:62px;font:700 30px/1 var(--f-num);font-variant-numeric:tabular-nums}
.rest .l{flex:1 1 auto;min-width:0;font-size:12.5px;opacity:.82}
.rest button{appearance:none;height:36px;padding:0 12px;border:1px solid currentColor;border-radius:10px;background:transparent;color:inherit;font:600 13px/1 var(--f-body);cursor:pointer}
.rest .p{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--hi);transition:width .25s linear}
.restbar.done .rest{background:var(--hi);color:var(--on-hi)}
.restbar.done .p{display:none}

/* 시트 · 대화상자 · 토스트 */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 24px);background:var(--scrim)}
.sheet-panel{width:100%;max-width:560px;max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px);outline:none}
@media (min-width:640px){.sheet{align-items:center;padding:32px}.sheet-panel{border-radius:20px}}
.sheet-h{position:sticky;top:0;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-h > :first-child{justify-self:start}
.sheet-h > :last-child{justify-self:end}
.sheet-h h2{font:700 16px/1.2 var(--f-body);text-align:center}
.sheet-b{padding:16px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.ed-items{display:grid;gap:10px;margin:16px 0 12px}
.ed-items{position:relative}
.ed-item{position:relative;display:grid;gap:12px;padding:6px 8px 6px 4px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.ed-item.open{padding-bottom:12px}
.ed-r1{display:flex;align-items:center;gap:4px;min-height:46px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.grip{flex:none;display:grid;place-items:center;width:24px;height:36px;color:var(--ink-3);cursor:grab}
.grip .ic{width:18px;height:18px}
.ed-no{flex:none;width:22px;text-align:center;font:700 18px/1 var(--f-num);color:var(--ink-3)}
.ed-nm{flex:1 1 auto;min-width:0;padding:0 6px;font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.ed-nm.ph{color:var(--ink-3);font-weight:500}
.ed-r0{padding:0 4px 0 8px}
.ed-r0 .txt{width:100%;margin-top:6px}
.ed-r2{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:0 4px 0 8px}
.ed-d{display:grid;gap:12px}
.ed-r3{display:flex;align-items:center;gap:6px;padding:0 4px 0 8px}
.ed-item.dragging{z-index:5;border-color:var(--ink-3);box-shadow:0 14px 30px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.12)}
.ed-item.dragging .grip{color:var(--ink)}
body.drag-on,body.drag-on *{cursor:grabbing!important;-webkit-user-select:none!important;user-select:none!important}
.ed-adds{margin-top:0}
.pk-q{width:100%}
.pk-g{margin-top:18px;display:grid;gap:8px}
.pk-list{display:grid;gap:6px}
.pk-it{appearance:none;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pk-box{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ink-3);color:transparent}
.pk-box .ic{width:16px;height:16px}
.pk-it[aria-checked="true"]{border-color:var(--ink)}
.pk-it[aria-checked="true"] .pk-box{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.pk-nm{flex:1 1 auto;min-width:0;font-weight:600;overflow-wrap:anywhere}
.pk-meta{flex:none;font-size:12.5px;color:var(--ink-3)}
.pk-it:disabled{cursor:default;opacity:.55}
.pk-none{margin-top:18px}
.lib{padding:14px 16px 16px;display:grid;gap:14px}
.lib-g{display:grid;gap:8px}
.lib-ch{display:flex;flex-wrap:wrap;gap:6px}
.lib-ch .chip{height:34px;white-space:normal;text-align:left}
.lib-help{margin:10px 2px 0;font-size:12.5px}
.ed-r3 .btn{margin-left:auto}
.ed-tg[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.nf{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.num{width:56px;height:40px;padding:0 4px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);text-align:center;font:600 18px/1 var(--f-num);font-variant-numeric:tabular-nums}
.num.wide{width:110px}
.num:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ed-help{margin:12px 2px 0;font-size:12.5px;color:var(--ink-2)}
.err{margin-top:10px;color:var(--up);font-size:13.5px;font-weight:600}
.srows{display:grid;gap:22px}
.srow{display:grid;gap:8px;justify-items:start}
.srow h3{font:700 14.5px/1.3 var(--f-body)}
.srow p{font-size:13px;color:var(--ink-2)}
.srow .txt{justify-self:stretch}
.code{width:100%;height:200px;margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.sum{display:grid;gap:12px}
.sum .tiles{margin:4px 0 0}
.sum-title{font:400 26px/1.2 var(--f-display);margin-top:-6px;overflow-wrap:anywhere}
.cmp{font-size:14px;font-weight:600}
.sub-h{font:700 13px/1.3 var(--f-body);color:var(--ink-2);margin-top:4px}
.pr-list{list-style:none;padding:0;display:grid;gap:6px}
.pr-list li{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px}
.scrim{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--scrim)}
.dialog{width:100%;max-width:360px;display:grid;gap:18px;padding:20px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
.dialog p{font-size:15px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:40;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--on-ink);font-size:13.5px;box-shadow:var(--shadow)}
body.has-rest .toast{bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 92px)}

/* 기록: 캘린더 */
.cal{padding:12px 10px 10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 10px}
.cal-h h2{font:700 16px/1.2 var(--f-body)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-dow{padding:2px 0 6px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.cal-dow.sun,.cal-d.sun{color:var(--up)}
.cal-dow.sat,.cal-d.sat{color:var(--down)}
.cal-d{appearance:none;display:flex;flex-direction:column;align-items:center;gap:5px;height:50px;padding:8px 0 0;border:0;border-radius:11px;background:transparent;color:var(--ink);font:600 16px/1 var(--f-num);font-variant-numeric:tabular-nums;cursor:pointer}
.cal-d:hover{box-shadow:inset 0 0 0 1px var(--line)}
.cal-d.blank{visibility:hidden;pointer-events:none}
.cal-d.has{background:var(--sunk)}
.cal-d.today span{box-shadow:0 2px 0 currentColor}
.cal-d .mk{display:flex;gap:3px}
.cal-d .mk i{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.cal-d .mk i.pr{background:var(--hi);box-shadow:0 0 0 1px var(--ink)}
.cal-d[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.cal-d[aria-pressed="true"] .mk i{background:var(--on-ink)}
.cal-d[aria-pressed="true"] .mk i.pr{background:var(--hi);box-shadow:none}
.cal-sum{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;padding:10px 4px 2px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.cal-sum b{font:700 17px/1 var(--f-num);color:var(--ink)}
.day-h{margin:20px 2px 10px;font:700 16px/1.3 var(--f-body)}

/* 코치 */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 10px}
.head + .sec-h{margin-top:6px}
.sec-h h2{font:700 16px/1.3 var(--f-body)}
.body-card{padding:14px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{min-width:0;padding:10px 11px;border-radius:12px;background:var(--sunk)}
.kv span{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.kv b{display:block;margin-top:4px;font:700 22px/1.1 var(--f-num);overflow-wrap:anywhere}
.kv small{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-2)}
.derived{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2)}
.derived b{font:700 16px/1 var(--f-num);color:var(--ink)}
.vol{display:grid;gap:8px;margin-top:8px}
.vol-row{display:grid;grid-template-columns:88px minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:13px}
.vol-bar{position:relative;height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.vol-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ink)}
.vol-bar i.full{background:var(--ok)}
.vol-row .nv{text-align:right;font-size:14px}
.hint{margin-top:8px;font-size:12px;color:var(--ink-3)}
.notes{list-style:none;padding:0;display:grid;gap:7px}
.notes li{position:relative;padding-left:14px;font-size:13.5px;line-height:1.55}
.notes li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.ref{font:600 12px/1 var(--f-num);letter-spacing:.03em;color:var(--ink-3);white-space:nowrap}
.review{padding:16px;display:grid;gap:12px}
.review .sec-h{margin:0}
.review .notice{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0}
.review .notice .btn{flex:none}
.vol-bar .ref-line{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink-3)}
.vol-row .nv small{display:block;margin-top:2px;font:500 11px/1.2 var(--f-body);color:var(--ink-3);white-space:nowrap}
.prop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start}
.prop p{font-size:13.5px;line-height:1.55}
.notice{display:block;width:100%;margin:0 0 12px;padding:11px 12px;border:0;border-radius:12px;background:var(--down-soft);color:var(--ink);font:500 13.5px/1.5 var(--f-body);text-align:left}
button.notice{cursor:pointer}
.log-list{list-style:none;padding:0;display:grid;gap:8px;font-size:13px}
.log-list li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.log-list .nv{font-size:14px;color:var(--ink-3)}
.ev{margin-top:22px;padding:4px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.ev summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:15px}
.ev summary span{font-weight:500;font-size:12.5px;color:var(--ink-3)}
.ev ol{margin:0 0 14px;padding:0 0 0 22px;display:grid;gap:14px}
.ev li{font-size:13.5px;line-height:1.55;padding-left:2px}
.ev li::marker{font:700 13px var(--f-num);color:var(--ink-3)}
.ev .src{display:block;font-size:12px;color:var(--ink-3)}
.ev .use{margin-top:4px;color:var(--ink-2)}
.ev a{color:var(--ink);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.fgrid label{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg button{appearance:none;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font:600 13px/1 var(--f-body);cursor:pointer}
.tg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.sel{height:40px;max-width:150px;padding:0 6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font:500 14px/1 var(--f-body)}
@media (max-width:380px){.vol-row{grid-template-columns:72px minmax(0,1fr) 56px}}

/* 단백질 */
.p-mini{display:grid;gap:8px;width:100%;margin:0 0 12px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.p-mini-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.p-mini-top .lbl{font-size:13px}
.p-mini-top b{font:700 22px/1 var(--f-num)}
.p-mini-top small{font:600 14px/1 var(--f-num);color:var(--ink-3)}
.p-bar{display:block;height:8px;border-radius:6px;background:var(--sunk);overflow:hidden}
.p-bar i{display:block;height:100%;border-radius:6px;background:var(--ink);transition:width .3s ease}
.p-bar i.full{background:var(--ok)}
.daynav{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
.daynav b{flex:1;text-align:center;font:700 15px/1.2 var(--f-body)}
.p-sum{padding:16px;display:grid;gap:12px}
.p-big{display:flex;align-items:baseline;gap:8px}
.p-big b{font:700 48px/1 var(--f-num)}
.p-big span{font:600 20px/1 var(--f-num);color:var(--ink-3)}
.p-sum .p-bar{height:10px}
.p-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2)}
.p-meta b{font:700 15px/1 var(--f-num);color:var(--ink)}
.plog{list-style:none;margin:0;padding:0 14px}
.plog li{display:grid;grid-template-columns:42px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plog li:first-child{border-top:0}
.plog .tm{font:600 13px/1 var(--f-num);color:var(--ink-3);font-variant-numeric:tabular-nums}
.nm{min-width:0;font-size:14px;overflow-wrap:anywhere}
.nm small{display:block;margin-top:2px;font-size:12px;color:var(--ink-3)}
.pv{font:700 17px/1 var(--f-num);white-space:nowrap}
.padd{padding:12px;display:grid;gap:10px}
.padd .chips{margin:0;padding-bottom:2px}
.flist{list-style:none;margin:0;padding:0}
.flist li{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.flist li:first-child{border-top:0}
.fitem{appearance:none;flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border:0;background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.fitem:hover .nm{text-decoration:underline;text-underline-offset:2px}
.fempty{padding:12px 4px;font-size:13.5px}
.p-calc{font-size:15px}
.p-calc b{font:700 34px/1 var(--f-num)}
.wk-card{padding:14px 12px 10px}
.wk-bars{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:130px;margin-top:4px;border-bottom:1px solid var(--line)}
.wk{appearance:none;position:relative;display:flex;align-items:flex-end;justify-content:center;height:100%;padding:0;border:0;background:none;cursor:pointer}
.wk i{display:block;width:min(24px,70%);min-height:2px;border-radius:4px 4px 0 0;background:var(--ink);opacity:.5}
.wk i.ok{background:var(--ok)}
.wk[aria-pressed="true"] i{opacity:1}
.wk .v{position:absolute;left:0;right:0;text-align:center;font:700 12px/1 var(--f-num);color:var(--ink)}
.tline{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--ink-3);pointer-events:none}
.wk-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px;text-align:center;font-size:11.5px;color:var(--ink-3)}
.wk-labels .on{color:var(--ink);font-weight:700}
.fsrc{margin:16px 2px 0;font-size:12px;line-height:1.6;color:var(--ink-3)}
.back{margin:8px 0 -6px -8px}
.fgrid .fcol{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fgrid .full{grid-column:1/-1}
.eyebrow .nt{text-transform:none}
.p-mini{-webkit-appearance:none;appearance:none}
.p-mini-top .lbl{color:var(--ink-2);font-weight:600}
.padd .txt[type="search"]{-webkit-appearance:none;appearance:none}
.fmore{width:100%;margin:4px 0}
.field.amt{width:180px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.toast{display:flex;align-items:center;gap:14px}
.toast-btn{appearance:none;flex:none;padding:4px 0;border:0;background:none;color:inherit;font:700 13.5px/1 var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="brand"><b>WORKOUT</b><span>Progressive overload</span></div>
    <span class="sync" id="sync" data-s="loading"><i></i><span id="sync-t">불러오는 중</span></span>
    <button class="icon-btn" type="button" data-act="settings" data-icon="gear" aria-label="설정"></button>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="restbar" id="restbar" hidden>
  <div class="wrap"><div class="rest" role="timer"><span class="t" id="rest-t">0:00</span><span class="l" id="rest-l">휴식 중</span><button type="button" data-act="rest-add">+15초</button><button type="button" data-act="rest-skip">건너뛰기</button><i class="p" id="rest-p"></i></div></div>
</div>

<nav class="tabbar" aria-label="화면 전환">
  <div class="wrap">
    <button class="tab" type="button" data-tab="workout" data-icon="workout"><span>운동</span><i class="live" id="live-dot" hidden></i></button>
    <button class="tab" type="button" data-tab="protein" data-icon="protein"><span>단백질</span></button>
    <button class="tab" type="button" data-tab="log" data-icon="log"><span>기록</span></button>
    <button class="tab" type="button" data-tab="progress" data-icon="progress"><span>성장</span></button>
    <button class="tab" type="button" data-tab="coach" data-icon="coach"><span>코치</span></button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden><div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div></div>
<div class="scrim" id="dialog" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js?v=2621667211"></script>

</body>
</html>
